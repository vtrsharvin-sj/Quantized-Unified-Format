[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quf"
version = "0.4.1"
description = "Single-file 4-bit LLM format with a native GPTQ converter and a fast CUDA/CPU runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vtrsharvin-sj" }]
keywords = ["quantization", "llm", "gptq", "int4", "4-bit", "triton", "cuda", "windows", "qwen"]
# The license is declared by the SPDX expression above (PEP 639), so no "License ::" classifier.
# The operating systems and the Python 3.N versions mirror the matrix in .github/workflows/ci.yml.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.7",
    "tokenizers",
]

[project.urls]
Homepage = "https://github.com/vtrsharvin-sj/Quantized-Unified-Format"
Repository = "https://github.com/vtrsharvin-sj/Quantized-Unified-Format"
Documentation = "https://github.com/vtrsharvin-sj/Quantized-Unified-Format/tree/main/docs"
Changelog = "https://github.com/vtrsharvin-sj/Quantized-Unified-Format/blob/main/CHANGELOG.md"
Issues = "https://github.com/vtrsharvin-sj/Quantized-Unified-Format/issues"

[project.optional-dependencies]
# Kept as an empty extra so `pip install quf[cuda]` still resolves; torch is a base dependency.
cuda = []
fast = [
    "triton-windows; sys_platform == 'win32'",
    "triton; sys_platform == 'linux'",
]
convert = [
    "torch>=2.7",
    "transformers",
    "datasets",
    "accelerate",
    "gigatoken",
    "tokenizers",
    "safetensors",
    "huggingface_hub",
]
test = [
    "pytest>=7",
    "hypothesis>=6",
    "tomli; python_version < '3.11'",
]

[project.scripts]
quf = "quf.cli:main"

[tool.setuptools.packages.find]
include = ["quf*"]

[tool.setuptools.data-files]
"share/doc/quf" = ["README.md", "docs/ENV.md", "docs/FORMAT.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires an NVIDIA GPU (skipped when none is available)",
    "convert: requires the convert extra and a real model conversion",
]
