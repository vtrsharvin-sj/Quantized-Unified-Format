name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Keep in sync with the "Programming Language :: Python :: 3.N" classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      # torch is a base dependency; the CPU index keeps the install small (no CUDA wheels).
      - name: Install wheel with test extras
        shell: bash
        run: |
          python -m pip install "$(ls dist/*.whl | head -n 1)[test]" \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run CPU test suite
        run: python -m pytest -m "not gpu and not convert" -q

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        with:
          name: wheel
          path: dist/*.whl
